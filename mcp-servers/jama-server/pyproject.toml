[project]
name = "jama-mcp-server"
version = "0.1.0"
description = "Read-only MCP server wrapping the Jama Connect REST API"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
